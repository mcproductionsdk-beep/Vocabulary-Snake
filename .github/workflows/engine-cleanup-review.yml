name: Snake engine cleanup review
on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  baseline-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine.test.mjs tests/session.test.mjs tests/build.test.mjs
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Compare baseline and candidate browser layouts
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/snake-parity-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/snake-game.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-parity.mjs
          node tests/browser-lifecycle.mjs
