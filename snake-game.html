<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Snake Pixel V2.3</title><link rel="stylesheet" href="./engine/snake.css"></head><body><main class="app"><div class="logo">WORD SNAKE</div>
<select id="language" hidden aria-hidden="true"><option value="es-ES">Spanish</option><option value="de-DE">German</option><option value="da-DK">Danish</option><option value="en-US">English</option><option value="fr-FR">French</option><option value="it-IT">Italian</option></select><div id="voiceCheck" hidden></div>
<section id="game" class="screen"><div class="hud"><div>SCORE <span id="score">0</span> · <span id="lives">❤❤❤</span></div><div id="target" class="target"></div><div id="progress" class="progress"></div></div><div id="wrap" class="wrap"><canvas id="canvas"></canvas><div id="toast" class="toast"></div><div id="pauseOverlay" class="overlay"><div class="big" style="color:#f2d64b">PAUSED</div></div><div id="gameOver" class="overlay"><div><div class="big">GAME OVER</div><div class="msg">Nice try, your grandma would be proud</div><button id="again" class="primary">PLAY AGAIN</button><button id="overMenu" class="pink">MAIN MENU</button></div></div></div><div class="buttons"><button id="pause" class="yellow">PAUSE</button><button id="restart">RESTART</button><button id="mainMenu" class="pink">MAIN MENU</button><button id="fullscreen" class="yellow">⛶ EXPAND GAME</button><button id="sound">🔊 SOUND ON</button></div><div class="mobile-controls" aria-label="Snake touch steering">
<button type="button" class="up" id="touchUp" aria-label="Steer up">▲</button>
<button type="button" class="left" id="touchLeft" aria-label="Steer left">◀</button>
<button type="button" class="down" id="touchDown" aria-label="Steer down">▼</button>
<button type="button" class="right" id="touchRight" aria-label="Steer right">▶</button>
</div><div class="tip">STEER: ARROWS / WASD · P: PAUSE · EDGES WRAP</div></section></main>
<script src="./engine/snake.js"></script><script src="./engine/adapter.js"></script></body></html>
